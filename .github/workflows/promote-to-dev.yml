# ======================================================================================
#  Last Updated: 2026-05-15
#
#  Description:
#  Promotes GHCR images by re-tagging them within GHCR. Replaces the legacy Tekton
#  'dev-release-pipeline'. Uses `docker buildx imagetools create` so the promotion is
#  server-side and digest-preserving — the destination tag points at the exact same
#  image manifest as the source.
#
#  Before each promotion the current ':dev' tag is preserved as ':dev-backup' (also
#  digest-preserving) so the previous image can be restored by re-tagging the backup
#  back to ':dev'.
#
#  OpenShift consumes the resulting GHCR tags (':dev', ':test', ':prod') directly and
#  is configured separately by the platform team.
#
# ======================================================================================

name: Promote all - Source to Dev

# --- TRIGGERS -----------------------------------------------------------------------
on:
  # This workflow is triggered manually, requiring explicit user action.
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Source tag to promote (e.g., develop, or a 7-char commit SHA)"
        required: true
        default: "develop"
      promoteScreening:
        description: "Promote screening-portal"
        type: boolean
        default: true
      promoteLicensing:
        description: "Promote licensing-portal"
        type: boolean
        default: true
      promoteDynamicsHelper:
        description: "Promote dynamics-helper"
        type: boolean
        default: true
      promoteJobScheduler:
        description: "Promote jag-jobscheduler"
        type: boolean
        default: true
      promoteGDSD:
        description: "Promote gdsd-portal"
        type: boolean
        default: true

# --- ENVIRONMENT VARIABLES (Preserving original structure) -------------------------
env:
  REGISTRY: ghcr.io
  SOURCE_TAG: ${{ github.event.inputs.imageTag }}
  TARGET_TAG: "dev"
  BACKUP_TAG: "dev-backup"

# --- JOBS ---------------------------------------------------------------------------
jobs:
  promote-images:
    name: Promote ${{ matrix.image_name }} to Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: Screening
            image_name: bcgov/pssg-spdbt/screening-portal
          - key: Licensing
            image_name: bcgov/pssg-spdbt/licensing-portal
          - key: DynamicsHelper
            image_name: bcgov/pssg-spdbt/dynamics-helper
          # NOTE: jag-jobscheduler lives under bcgov/, not bcgov/pssg-spdbt/.
          # If the default GITHUB_TOKEN lacks write access to the cross-repo
          # package, grant this repo write access in the package settings.
          - key: JobScheduler
            image_name: bcgov/jag-jobscheduler
          - key: GDSD
            image_name: bcgov/pssg-spdbt/gdsd-portal

    env:
      IMAGE: ${{ matrix.image_name }}

    steps:
      - name: Evaluate per-component toggle
        id: gate
        run: |
          case "${{ matrix.key }}" in
            Screening)      ENABLED="${{ github.event.inputs.promoteScreening }}" ;;
            Licensing)      ENABLED="${{ github.event.inputs.promoteLicensing }}" ;;
            DynamicsHelper) ENABLED="${{ github.event.inputs.promoteDynamicsHelper }}" ;;
            JobScheduler)   ENABLED="${{ github.event.inputs.promoteJobScheduler }}" ;;
            GDSD)           ENABLED="${{ github.event.inputs.promoteGDSD }}" ;;
          esac
          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          echo "Promotion enabled for ${{ matrix.key }}: $ENABLED"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture current target digest (for backup)
        if: steps.gate.outputs.enabled == 'true'
        id: get_target_digest
        run: |
          TARGET_DIGEST=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TARGET_TAG }}" \
            --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "target_digest=$TARGET_DIGEST" >> $GITHUB_OUTPUT
          echo "Current '${{ env.TARGET_TAG }}' digest: ${TARGET_DIGEST:-<none>}"

      - name: Backup current target image (by digest)
        if: steps.gate.outputs.enabled == 'true' && steps.get_target_digest.outputs.target_digest != ''
        run: |
          echo "Backing up '${{ env.TARGET_TAG }}' to '${{ env.BACKUP_TAG }}' by digest..."
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.BACKUP_TAG }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.get_target_digest.outputs.target_digest }}"
          echo "Backup successful."

      - name: Promote source to target
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "Promoting '${{ env.IMAGE }}:${{ env.SOURCE_TAG }}' to '${{ env.IMAGE }}:${{ env.TARGET_TAG }}'..."
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TARGET_TAG }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.SOURCE_TAG }}"
          echo "Promotion successful."

      - name: Validate Promotion by Comparing Image Digests
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "Validating promotion for image '${{ env.IMAGE }}'..."

          SOURCE_SHA=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.SOURCE_TAG }}" \
            --format '{{.Manifest.Digest}}')
          TARGET_SHA=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TARGET_TAG }}" \
            --format '{{.Manifest.Digest}}')

          echo "Source Digest: $SOURCE_SHA"
          echo "Target Digest: $TARGET_SHA"

          if [[ -z "$SOURCE_SHA" ]]; then
            echo "::error::Could not find source digest for tag '${{ env.SOURCE_TAG }}' for image '${{ env.IMAGE }}'."
            exit 1
          fi

          if [[ "$SOURCE_SHA" == "$TARGET_SHA" ]]; then
            echo "Validation successful! Digests match perfectly."
          else
            echo "::error::Image digests do not match after promotion for image '${{ env.IMAGE }}'."
            exit 1
          fi
