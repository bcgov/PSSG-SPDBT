# ======================================================================================
#  Last Updated: 2025-12-08
#
#  Description:
#  Promotes images by re-tagging them within the OpenShift ImageStream.
#  This in-cluster promotion guarantees image digest is preserved.
#  Promotes all PSSG-SPDBT services from test to training environment.
#
# ======================================================================================

name: Promote - Test to Training

# --- TRIGGERS -----------------------------------------------------------------------
on:
  # This workflow is triggered manually, requiring explicit user action.
  workflow_dispatch:
    inputs:
      source_tag:
        description: "The source tag to promote (e.g., test, or a specific shortsha tag)"
        required: false
        default: "test"

# --- ENVIRONMENT VARIABLES ----------------------------------------------------------
env:
  IMAGE_REGISTRY: ${{ vars.OCP4_REGISTRY }}
  NAMESPACE: ${{ secrets.OCP4_NAMESPACE }}
  SOURCE_TAG: ${{ github.event.inputs.source_tag }}
  TARGET_TAG: "training"
  BACKUP_TAG: "training-backup"

# --- JOBS ---------------------------------------------------------------------------
jobs:
  promote-images:
    name: Promote ${{ matrix.image_name }} to Training
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_name: [
          "screening-portal",
          "licensing-portal",
          "gdsd-portal",
          "dynamics-helper"
        ]

    env:
      IMAGE_NAME: ${{ matrix.image_name }}

    steps:
      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Login to OpenShift
        run: |
          oc login --token="${{ secrets.OCP4_PASSWORD }}" --server="${{ secrets.OPENSHIFT_SERVER }}"

      - name: Get source digest
        id: get_source_digest
        run: |
          SOURCE_DIGEST=$(oc get istag ${{ env.IMAGE_NAME }}:${{ env.SOURCE_TAG }} -n ${{ env.NAMESPACE }} -o jsonpath='{.image.metadata.name}')
          echo "source_digest=$SOURCE_DIGEST" >> $GITHUB_OUTPUT

      - name: Get target digest (for backup)
        id: get_target_digest
        run: |
          TARGET_DIGEST=$(oc get istag ${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }} -n ${{ env.NAMESPACE }} -o jsonpath='{.image.metadata.name}' 2>/dev/null || echo "")
          echo "target_digest=$TARGET_DIGEST" >> $GITHUB_OUTPUT

      - name: Backup Current Target Image (by digest)
        if: steps.get_target_digest.outputs.target_digest != ''
        run: |
          echo "Backing up current '${{ env.TARGET_TAG }}' image to '${{ env.BACKUP_TAG }}' by digest..."
          oc tag ${{ env.IMAGE_NAME }}@${{ steps.get_target_digest.outputs.target_digest }} ${{ env.IMAGE_NAME }}:${{ env.BACKUP_TAG }} --reference
          echo "Backup successful."

      - name: Promote source to target (by digest)
        run: |
          echo "Promoting '${{ env.SOURCE_TAG }}' to '${{ env.TARGET_TAG }}' by digest for image '${{ env.IMAGE_NAME }}'..."
          oc tag ${{ env.IMAGE_NAME }}@${{ steps.get_source_digest.outputs.source_digest }} ${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }} --reference
          echo "Promotion successful."

      - name: Validate Promotion by Comparing Image Digests
        run: |
          echo "Validating promotion for image '${{ env.IMAGE_NAME }}'..."
          sleep 5

          SOURCE_SHA=$(oc get imagestreamtag ${{ env.IMAGE_NAME }}:${{ env.SOURCE_TAG }} -n ${{ env.NAMESPACE }} -o jsonpath='{.image.metadata.name}')
          TARGET_SHA=$(oc get imagestreamtag ${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }} -n ${{ env.NAMESPACE }} -o jsonpath='{.image.metadata.name}')

          echo "Source Digest: $SOURCE_SHA"
          echo "Target Digest: $TARGET_SHA"

          if [[ -z "$SOURCE_SHA" ]]; then
            echo "::error::Could not find source digest for tag '${{ env.SOURCE_TAG }}' for image '${{ env.IMAGE_NAME }}'."
            exit 1
          fi

          if [[ "$SOURCE_SHA" == "$TARGET_SHA" ]]; then
            echo "Validation successful! Digests match perfectly."
          else
            echo "::error::Image digests do not match after promotion for image '${{ env.IMAGE_NAME }}'."
            exit 1
          fi

      - name: Verify Deployment Updated to New Image
        run: |
          echo "Waiting for deployment image to update..."
          PROMOTED_DIGEST=$(oc get istag ${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }} -n ${{ env.NAMESPACE }} -o jsonpath='{.image.metadata.name}')

          for i in {1..60}; do
            CURRENT_IMAGE=$(oc get deployment training-${{ env.IMAGE_NAME }} -n fe7e29-test -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")

            if [[ -n "$CURRENT_IMAGE" && "$CURRENT_IMAGE" == *"$PROMOTED_DIGEST"* ]]; then
              echo "✅ Deployment training-${{ env.IMAGE_NAME }} image updated to new digest"
              break
            fi

            if [[ $i -eq 60 ]]; then
              echo "::error::Deployment did not update after 60 seconds"
              exit 1
            fi

            sleep 1
          done

      - name: Wait for Deployment Rollout
        run: |
          echo "Waiting for training deployment rollout..."
          oc rollout status deployment/training-${{ env.IMAGE_NAME }} -n fe7e29-test --timeout=10m || true

      - name: Run Smoke Tests
        run: |
          echo "Running smoke tests on training environment for ${{ env.IMAGE_NAME }}..."

          TRAINING_ROUTE=$(oc get route training-${{ env.IMAGE_NAME }} -n fe7e29-test -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
          if [[ -n "$TRAINING_ROUTE" ]]; then
            echo "Testing training deployment: https://$TRAINING_ROUTE/health/liveness"
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://$TRAINING_ROUTE/health/liveness || echo "000")
            if [[ "$RESPONSE" == "200" ]]; then
              echo "✅ Training deployment smoke test passed!"
            else
              echo "::warning::Training deployment returned $RESPONSE"
            fi
          else
            echo "::warning::No route found for training-${{ env.IMAGE_NAME }}, skipping smoke test"
          fi
