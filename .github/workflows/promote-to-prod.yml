# ======================================================================================
#  Description:
#  Promotes images from the 'test' tag to 'prod' by re-tagging within the OpenShift
#  ImageStream in fe7e29-tools. Promotion is in-cluster and digest-preserving
#  (`oc tag ...@<digest>`), so ArgoCD (fe7e29-sparc-prod) rolls the exact same image.
#
#  Before each promotion the current 'prod' tag is preserved as 'prod-backup' (by
#  digest) so the previous image can be restored by re-tagging the backup.
#
#  Auth: logs into Emerald with the fe7e29-tools 'pipeline' service account token.
# ======================================================================================

name: Promote all - Test to Prod

# --- TRIGGERS -----------------------------------------------------------------------
on:
  # This workflow is triggered manually, requiring explicit user action.
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Source ImageStream tag to promote from"
        type: string
        default: "test"
      promoteScreening:
        description: "Promote screening-portal"
        type: boolean
        default: true
      promoteLicensing:
        description: "Promote licensing-portal"
        type: boolean
        default: true
      promoteDynamicsHelper:
        description: "Promote dynamics-helper"
        type: boolean
        default: true
      promoteGDSD:
        description: "Promote gdsd-portal"
        type: boolean
        default: true

# --- ENVIRONMENT VARIABLES ----------------------------------------------------------
env:
  NAMESPACE: ${{ secrets.OCP4_NAMESPACE }}
  SOURCE_TAG: ${{ github.event.inputs.source_tag }}
  TARGET_TAG: "prod"
  BACKUP_TAG: "prod-backup"

# --- JOBS ---------------------------------------------------------------------------
jobs:
  promote-images:
    name: Promote ${{ matrix.image_name }} to Prod
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: Screening
            image_name: screening-portal
          - key: Licensing
            image_name: licensing-portal
          - key: DynamicsHelper
            image_name: dynamics-helper
          - key: GDSD
            image_name: gdsd-portal

    env:
      IMAGE_NAME: ${{ matrix.image_name }}

    steps:
      - name: Evaluate per-component toggle
        id: gate
        run: |
          case "${{ matrix.key }}" in
            Screening)      ENABLED="${{ github.event.inputs.promoteScreening }}" ;;
            Licensing)      ENABLED="${{ github.event.inputs.promoteLicensing }}" ;;
            DynamicsHelper) ENABLED="${{ github.event.inputs.promoteDynamicsHelper }}" ;;
            GDSD)           ENABLED="${{ github.event.inputs.promoteGDSD }}" ;;
          esac
          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          echo "Promotion enabled for ${{ matrix.key }}: $ENABLED"

      - name: Install OpenShift CLI
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl -sLO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Login to OpenShift (Emerald)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          oc login --token="${{ secrets.OCP4_PASSWORD }}" --server="${{ secrets.OPENSHIFT_SERVER }}"

      - name: Get source digest
        id: src
        if: steps.gate.outputs.enabled == 'true'
        run: |
          SOURCE_DIGEST=$(oc get istag "${IMAGE_NAME}:${SOURCE_TAG}" -n "${NAMESPACE}" -o jsonpath='{.image.metadata.name}')
          if [ -z "$SOURCE_DIGEST" ]; then
            echo "::error::Source tag ${IMAGE_NAME}:${SOURCE_TAG} not found in ${NAMESPACE}."
            exit 1
          fi
          echo "digest=$SOURCE_DIGEST" >> $GITHUB_OUTPUT
          echo "Source ${IMAGE_NAME}:${SOURCE_TAG} = ${SOURCE_DIGEST}"

      - name: Backup current target image (by digest)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          TARGET_DIGEST=$(oc get istag "${IMAGE_NAME}:${TARGET_TAG}" -n "${NAMESPACE}" -o jsonpath='{.image.metadata.name}' 2>/dev/null || true)
          if [ -n "$TARGET_DIGEST" ]; then
            echo "Backing up ${TARGET_TAG} -> ${BACKUP_TAG} (${TARGET_DIGEST})"
            oc tag "${IMAGE_NAME}@${TARGET_DIGEST}" "${IMAGE_NAME}:${BACKUP_TAG}" -n "${NAMESPACE}" --reference-policy=local
          else
            echo "No existing ${TARGET_TAG} tag to back up."
          fi

      - name: Promote source to target (by digest)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "Promoting ${IMAGE_NAME}:${SOURCE_TAG} -> ${IMAGE_NAME}:${TARGET_TAG}"
          oc tag "${IMAGE_NAME}@${{ steps.src.outputs.digest }}" "${IMAGE_NAME}:${TARGET_TAG}" -n "${NAMESPACE}" --reference-policy=local
          echo "Promotion successful. ArgoCD (fe7e29-sparc-prod) will roll the new image."

      - name: Validate promotion (digests match)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          SOURCE_SHA=$(oc get istag "${IMAGE_NAME}:${SOURCE_TAG}" -n "${NAMESPACE}" -o jsonpath='{.image.metadata.name}')
          TARGET_SHA=$(oc get istag "${IMAGE_NAME}:${TARGET_TAG}" -n "${NAMESPACE}" -o jsonpath='{.image.metadata.name}')
          echo "Source: ${SOURCE_SHA}"
          echo "Target: ${TARGET_SHA}"
          if [ "${SOURCE_SHA}" == "${TARGET_SHA}" ] && [ -n "${SOURCE_SHA}" ]; then
            echo "Validation successful — ${TARGET_TAG} now points at the ${SOURCE_TAG} image."
          else
            echo "::error::Digests do not match after promotion for ${IMAGE_NAME}."
            exit 1
          fi
